
name: Build CorzClient Fabric 1.21.11

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build Fabric mod
        working-directory: CorzClient-SourcedByDexter
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: CorzClient-Fabric-1.21.11
          path: CorzClient-SourcedByDexter/build/libs/*.jar
          if-no-files-found: error
